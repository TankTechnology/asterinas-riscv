# Xorg configuration for the Asterinas RISC-V framebuffer chain (fallback).
#
# fbdev driver on /dev/fb0 + evdev input on the keyboard/tablet devices. This is
# selected by /init only when /dev/dri/card0 is absent (i.e. the guest was booted
# with the bochs-display simple-framebuffer chain instead of virtio-gpu).

Section "ServerLayout"
    Identifier     "layout"
    Screen         "screen0"
    InputDevice    "keyboard" "CoreKeyboard"
    InputDevice    "pointer"  "CorePointer"
EndSection

Section "Device"
    Identifier     "fbdev0"
    Driver         "fbdev"
EndSection

Section "Screen"
    Identifier     "screen0"
    Device         "fbdev0"
EndSection

Section "InputDevice"
    Identifier     "keyboard"
    Driver         "evdev"
    Option         "Device" "/dev/input/event1"
    Option         "CoreKeyboard"
EndSection

# virtio-tablet (EV_ABS) — the absolute pointer device. Kept as the explicit
# CorePointer so Xorg does not fall back to "first mouse device", which would
# otherwise re-pick the evdev keyboard and fail with a duplicate-device error.
#
# The tablet reports both EV_ABS (ABS_X/ABS_Y) and EV_REL (only REL_WHEEL), so
# evdev would otherwise configure it as a relative mouse and discard the
# absolute coordinates. "IgnoreAbsoluteAxes" "false" un-ignores the absolute
# axes so the pointer tracks the tablet's absolute position.
Section "InputDevice"
    Identifier     "pointer"
    Driver         "evdev"
    Option         "Device" "/dev/input/event0"
    Option         "CorePointer"
    Option         "IgnoreAbsoluteAxes" "false"
EndSection
