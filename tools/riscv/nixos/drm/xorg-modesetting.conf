# Xorg configuration for the Asterinas DRM device (/dev/dri/card0).
#
# Uses the standard modesetting driver instead of the fbdev driver, so the
# server drives the real KMS path (dumb buffers + mmap + mode setting) exposed
# by the kernel's DRM node. ShadowFB + software rendering is forced: the server
# renders into a shadow framebuffer and pushes it to the scanout through
# DRM_IOCTL_MODE_DIRTYFB, which the kernel maps to a virtio-gpu
# TRANSFER_TO_HOST_2D + FLUSH.

Section "ServerLayout"
    Identifier     "layout"
    Screen         "screen0"
    InputDevice    "keyboard" "CoreKeyboard"
    InputDevice    "pointer"  "CorePointer"
EndSection

Section "Device"
    Identifier     "modeset0"
    Driver         "modesetting"
    Option         "ShadowFB"  "true"
    Option         "PageFlip"  "false"
EndSection

Section "Screen"
    Identifier     "screen0"
    Device         "modeset0"
EndSection

# virtio-tablet (EV_ABS) — the absolute pointer device. See the fbdev Xorg
# config: kept as the explicit CorePointer and un-ignored so the pointer tracks
# the tablet's absolute position.
Section "InputDevice"
    Identifier     "pointer"
    Driver         "evdev"
    Option         "Device" "/dev/input/event0"
    Option         "CorePointer"
    Option         "IgnoreAbsoluteAxes" "false"
EndSection

Section "InputDevice"
    Identifier     "keyboard"
    Driver         "evdev"
    Option         "Device" "/dev/input/event1"
    Option         "CoreKeyboard"
EndSection
