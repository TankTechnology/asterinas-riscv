# Xorg configuration for a visible CPU-rendered DRM fallback.

Section "ServerLayout"
    Identifier     "layout"
    Screen         "screen0"
    InputDevice    "keyboard" "CoreKeyboard"
    InputDevice    "pointer"  "CorePointer"
EndSection

Section "Device"
    Identifier     "virtio-gpu"
    Driver         "modesetting"
    Option         "AccelMethod" "none"
    Option         "ShadowFB"    "true"
    Option         "PageFlip"    "false"
EndSection

Section "Screen"
    Identifier     "screen0"
    Device         "virtio-gpu"
EndSection

Section "InputDevice"
    Identifier     "keyboard"
    Driver         "evdev"
    Option         "Device" "/dev/input/event0"
    Option         "CoreKeyboard"
    Option         "XkbRules" "evdev"
    Option         "XkbModel" "pc105"
    Option         "XkbLayout" "us"
    Option         "XkbCompiledKeymap" "/etc/xkb/default.xkm"
EndSection

Section "InputDevice"
    Identifier     "pointer"
    Driver         "evdev"
    Option         "Device" "/dev/input/event1"
    Option         "CorePointer"
    Option         "IgnoreAbsoluteAxes" "false"
EndSection

Section "ServerFlags"
    Option "BlankTime"   "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime"     "0"
EndSection
