\* Pre-fix behaviour: a write fault always upgrades the PTE in place, without
\* checking whether the frame is still shared. TLC must find the isolation
\* violation.
\* EXPECT: violation CoWIsolation

CONSTANTS
    Proc = {"init", "p", "c1", "c2"}
    Addr = {1, 2}
    Frames = {1, 2, 3, 4, 5, 6}
    Values = {0, 1}
    BUGGY = "no_ref_check"

INIT Init
NEXT Next

INVARIANTS
    CoWIsolation
