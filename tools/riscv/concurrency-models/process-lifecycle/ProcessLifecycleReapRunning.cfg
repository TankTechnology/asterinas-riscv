\* Pre-fix behaviour: a wait may reap a child that has not exited (the exit
\* status is read before it is published). TLC must find the violation.
\* EXPECT: violation ReapRequiresExit

CONSTANTS
    Proc = {"init", "p", "c1", "c2"}
    BUGGY = "reap_running"

INIT Init
NEXT Next

INVARIANTS
    ReapRequiresExit
