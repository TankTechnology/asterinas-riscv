\* Pre-fix behaviour: exiting does not re-parent children, so a zombie can be
\* left with a parent that no longer exists. TLC must find the violation.
\* EXPECT: violation NoOrphan

CONSTANTS
    Proc = {"init", "p", "c1", "c2"}
    BUGGY = "no_reparent"

INIT Init
NEXT Next

INVARIANTS
    NoOrphan
