\* Pre-fix behaviour: any running process may reap any zombie, so a child can
\* be reaped by someone other than its parent. TLC must find the violation.
\* EXPECT: violation OnlyParentReaps

CONSTANTS
    Proc = {"init", "p", "c1", "c2"}
    BUGGY = "reap_anyone"

INIT Init
NEXT Next

INVARIANTS
    OnlyParentReaps
