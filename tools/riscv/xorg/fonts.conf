<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Minimal fontconfig config for the RISC-V desktop.
     Self-contained: does not pull in /etc/fonts/conf.d. Maps the generic
     families onto the bundled Liberation families (Sans/Serif/Mono, each with
     Regular/Bold/Italic/BoldItalic) so pango/GTK2 can resolve real serif and
     monospace faces AND bold/italic variants, instead of collapsing every
     generic family onto a single Adwaita Sans Regular. -->
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <cachedir>/tmp</cachedir>

  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Liberation Serif</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Liberation Mono</string></edit>
  </match>
</fontconfig>
