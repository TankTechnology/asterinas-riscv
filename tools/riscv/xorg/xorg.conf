# Xorg configuration for the Asterinas RISC-V framebuffer chain.
# fbdev driver on /dev/fb0 + evdev input on the keyboard device.

Section "ServerLayout"
    Identifier     "layout"
    Screen         "screen0"
    InputDevice    "keyboard" "CoreKeyboard"
EndSection

Section "Device"
    Identifier     "fbdev0"
    Driver         "fbdev"
EndSection

Section "Screen"
    Identifier     "screen0"
    Device         "fbdev0"
EndSection

Section "InputDevice"
    Identifier     "keyboard"
    Driver         "evdev"
    Option         "Device" "/dev/input/event1"
    Option         "CoreKeyboard"
EndSection
