[*]
wallpaper_mode=center
wallpaper_common=1
wallpaper=/usr/share/asterinas/desktop-anime-wallpaper.png
desktop_bg=#071426
desktop_fg=#f3fffd
desktop_shadow=#10243a
show_wm_menu=0
sort=name;ascending;
show_documents=0
show_trash=1
# Mounted-volume probing walks /proc and /sys every few seconds; the desktop
# has no hotplug sources on this board, so the work is pure overhead.
show_mounts=0
