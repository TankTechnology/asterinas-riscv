# Install as /etc/systemd/system.conf.d/10-console-budget.conf
#
# Boot-time console budget.
#
# The board's serial console runs at 115200 baud and the kernel writes to it
# synchronously, so every line the manager emits costs a few milliseconds of
# boot time -- and before journald is up, `LogTarget=journal-or-kmsg` sends
# every manager message to /dev/kmsg, which is exactly that console. Measured
# on the Megrez board: systemd-journald.socket came up at 3.9 s, and the next
# unit did not start until 11.7 s, with nothing in between but the manager's
# own status lines (one event per ~290 ms).
#
# `LogTarget=journal` drops the duplicate instead of queueing it on the wire.
# What still reaches the serial console: the kernel's own messages at
# loglevel=warn, and the output of every unit that explicitly asks for
# `StandardOutput=journal+console` (the desktop session does, for the QEMU
# serial contract). Everything else is in the journal, which is where an
# operator reads it anyway.
#
# To get the early-boot manager messages back for a diagnosis, boot once with
# `systemd.log_target=kmsg systemd.show_status=yes` on the kernel command line.
[Manager]
LogTarget=journal
ShowStatus=no
