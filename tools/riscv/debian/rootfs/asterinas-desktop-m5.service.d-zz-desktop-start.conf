[Unit]
# Three boot-time facts this image has, all learned the slow way.
#
# 1. basic.target is never activated here, and DefaultDependencies=yes adds an
#    implicit After=basic.target. The session's own [Install] section asked for
#    basic.target, so nothing started it at boot: it ran only when an evidence
#    unit pulled it in, 17 seconds later.
# 2. A unit ordered after a target that never activates waits for it.
# 3. sysinit.target is not a prerequisite of the session. It is ordered behind
#    whatever else is in the boot transaction -- on this image, mounting the
#    /data partition, which reads 1834 block/inode bitmaps and costs 2.3 s
#    (see 2026-11-14-boot-time-optimization.md section 6). Waiting for sysinit put those seconds
#    in front of the desktop for no benefit: what the session actually needs is
#    the root filesystem, /run, the device nodes and the journal socket, and it
#    waits for the framebuffer itself in desktop-m5-device-access.
DefaultDependencies=no
# `After=` with no value clears the list an earlier drop-in or the unit set;
# without it, later assignments only add to it.
After=
After=local-fs.target systemd-journald.socket
Conflicts=shutdown.target
Before=shutdown.target

[Install]
WantedBy=asterinas-debug-console.target
