[Unit]
# Two boot-time facts this image has, both learned the slow way.
#
# 1. basic.target is never activated here, and DefaultDependencies=yes adds an
#    implicit After=basic.target. The session's own [Install] section asked for
#    basic.target, so nothing started it at boot: it ran only when an evidence
#    unit pulled it in, 17 seconds later.
# 2. A unit ordered after a target that never activates waits for it.
DefaultDependencies=no
After=sysinit.target local-fs.target systemd-journald.socket
Conflicts=shutdown.target
Before=shutdown.target

[Install]
WantedBy=asterinas-debug-console.target
