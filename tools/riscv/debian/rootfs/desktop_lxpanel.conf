Global {
    edge=top
    align=left
    margin=0
    widthtype=percent
    width=100
    height=34
    transparent=0
    tintcolor=#10243a
    alpha=255
    setdocktype=1
    setpartialstrut=1
    usefontcolor=1
    fontcolor=#f3fffd
    usefontsize=1
    fontsize=10
    background=0
}

Plugin {
    type=menu
    Config {
        name=Asterinas
        image=start-here
        system {
        }
    }
}

Plugin {
    type=launchbar
    Config {
        Button {
            id=asterinas-browser.desktop
        }
        Button {
            id=asterinas-files.desktop
        }
        Button {
            id=asterinas-terminal.desktop
        }
    }
}

Plugin {
    type=taskbar
    expand=1
    Config {
        tooltips=1
        IconsOnly=0
        ShowAllDesks=1
        UseMouseWheel=1
        UseUrgencyHint=1
        FlatButton=0
    }
}

Plugin {
    type=dclock
    Config {
        ClockFmt=%H:%M
        TooltipFmt=%A %Y-%m-%d
        BoldFont=1
        CenterText=1
    }
}
