[Service]
# The offline profile must not enter the network stack just to synchronize a
# clock.  Check the kernel command line in a shell first because the Asterinas
# systemd port does not reliably export manager setenv values to a `+` prestart
# process.  Online boots still run the bounded Python synchronizer.
ExecStartPre=-/bin/sh -c 'case " $(cat /proc/cmdline 2>/dev/null) " in *" ASTERINAS_DESKTOP_OFFLINE=1 "*|*" systemd.setenv=ASTERINAS_DESKTOP_OFFLINE=1 "*) exit 0;; *) exec /usr/lib/asterinas/megrez-clock-sync;; esac'
