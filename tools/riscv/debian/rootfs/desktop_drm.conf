# SPDX-License-Identifier: MPL-2.0

Section "Device"
    Identifier "Asterinas virtio-gpu"
    Driver "modesetting"
    Option "DRI" "3"
    Option "AccelMethod" "glamor"
    Option "kmsdev" "/dev/dri/card0"
EndSection

Section "Screen"
    Identifier "Asterinas DRM screen"
    Device "Asterinas virtio-gpu"
    DefaultDepth 24
EndSection

Section "InputDevice"
    Identifier "Asterinas keyboard"
    Driver "evdev"
    Option "Device" "/run/asterinas-input/keyboard"
EndSection

Section "InputDevice"
    Identifier "Asterinas pointer"
    Driver "evdev"
    Option "Device" "/run/asterinas-input/pointer"
EndSection

Section "ServerLayout"
    Identifier "Asterinas DRM layout"
    Screen 0 "Asterinas DRM screen"
    InputDevice "Asterinas keyboard" "CoreKeyboard"
    InputDevice "Asterinas pointer" "CorePointer"
EndSection

Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection
