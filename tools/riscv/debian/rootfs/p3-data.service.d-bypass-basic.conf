[Unit]
DefaultDependencies=no
After=
After=local-fs.target
# No `Before=sysinit.target`: mounting the data partition is worth doing early,
# but nothing on the way to the desktop reads /data. Behind sysinit.target its
# 3 s (measured on the board) held the whole boot, including the desktop
# session, which is started after sysinit. The units that really need /data say
# so themselves -- dsh-web.service has Requires=p3-data.service After=it.
