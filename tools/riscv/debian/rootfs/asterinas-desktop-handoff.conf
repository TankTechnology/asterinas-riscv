# Drop-in for the stage1 readiness service.
#
# That service disarms the kernel watchdog but, in the stage1 image on the
# board's boot partition, does not publish the boot-bound handoff file that
# megrez-safe-reboot waits for. Without it the userspace timer reboots a
# healthy desktop at its 720 s deadline (measured on the board: every boot
# without the file restarted at 721 s). A drop-in applies even though the
# unit itself is generated at boot in /run/systemd/system, and ExecStartPost
# runs only after the readiness tool has succeeded -- a desktop that really
# fails to come up still gets its recovery reboot.
[Service]
ExecStartPost=/bin/sh -c 'cat /proc/sys/kernel/random/boot_id > /run/asterinas-desktop-ready'
