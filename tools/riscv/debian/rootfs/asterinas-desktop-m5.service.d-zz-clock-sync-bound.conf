# Install as
# /etc/systemd/system/asterinas-desktop-m5.service.d/zz-clock-sync-bound.conf
#
# The desktop unit runs three pre-start steps. One of them set the board's
# clock from an HTTP Date header, and it was the most expensive thing in the
# whole boot: the network is not up that early, so it sat through its
# per-source timeouts -- 5.0 s measured end to end (16.2 s unit start, 21.2 s
# "CLOCK_SYNC_READY") -- and the desktop waited for all of it.
#
# The clock sync is now its own unit (megrez-clock-sync.service), which runs in
# parallel and finishes whenever it finishes; nothing downstream needs it to be
# synchronous, because the first page a user opens comes seconds later.
#
# A drop-in cannot delete one line of ExecStartPre, so the remaining two steps
# are restated here; keep them in sync with the unit itself.
[Service]
ExecStartPre=
ExecStartPre=+/usr/lib/asterinas/desktop-m5-device-access
ExecStartPre=-/bin/sh /usr/lib/asterinas/asterinas-resolv
