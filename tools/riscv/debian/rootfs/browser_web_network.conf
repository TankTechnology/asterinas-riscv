[Unit]
# The M5 network service runs the full qualification workload. Daily Firefox
# startup needs only the configured network path and must not wait for it.
ConditionKernelCommandLine=!systemd.setenv=ASTERINAS_BROWSER_WEB_BASIC_ONLY=1

[Service]
TimeoutStartSec=600s
