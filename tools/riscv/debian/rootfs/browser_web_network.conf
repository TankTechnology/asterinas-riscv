[Unit]
# The network service runs the full qualification workload. Daily Firefox
# startup needs only the configured network path and must not wait for it.
ConditionKernelCommandLine=!systemd.setenv=ASTERINAS_BROWSER_WEB_BASIC_ONLY=1

[Service]
# The evidence script bounds itself well below this; keep the unit timeout in
# step so a wedged probe ends the unit instead of holding boot for ten
# minutes.
TimeoutStartSec=45s
