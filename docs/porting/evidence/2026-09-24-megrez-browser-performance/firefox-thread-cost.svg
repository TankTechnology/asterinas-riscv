<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540"
viewBox="0 0 1120 540" role="img"
aria-label="Firefox video playback thread CPU and runqueue wait at two display sizes">
<rect width="1120" height="540" fill="#fbfcfe"/>
<style>
text{font-family:DejaVu Sans,Arial,sans-serif;fill:#1b2735}
.title{font-size:24px;font-weight:700}.subtitle{font-size:13px;fill:#526479}
.head{font-size:16px;font-weight:700}.row{font-size:14px}
.small{font-size:12px;fill:#607186}.value{font-size:13px;font-weight:600}
</style>
<text x="42" y="46" class="title">Firefox 720p VP8: thread-level cost</text>
<text x="42" y="72" class="subtitle">Same 300-frame source; one 10.5 s sampled playback per display size on Megrez Asterinas</text>
<text x="260" y="122" class="head">CPU time (s)</text>
<text x="770" y="122" class="head">Runqueue wait (s)</text>
<rect x="260" y="140" width="14" height="14" fill="#d56738"/><text x="281" y="152" class="small">user</text>
<rect x="333" y="140" width="14" height="14" fill="#efaa78"/><text x="354" y="152" class="small">kernel</text>
<rect x="770" y="140" width="14" height="14" fill="#4386b9"/><text x="791" y="152" class="small">runnable, awaiting CPU</text>

<line x1="260" y1="172" x2="260" y2="426" stroke="#dce4eb"/>
<text x="260" y="449" text-anchor="middle" class="small">0</text>
<line x1="378" y1="172" x2="378" y2="426" stroke="#dce4eb"/>
<text x="378" y="449" text-anchor="middle" class="small">2</text>
<line x1="496" y1="172" x2="496" y2="426" stroke="#dce4eb"/>
<text x="496" y="449" text-anchor="middle" class="small">4</text>
<line x1="614" y1="172" x2="614" y2="426" stroke="#dce4eb"/>
<text x="614" y="449" text-anchor="middle" class="small">6</text>
<line x1="732" y1="172" x2="732" y2="426" stroke="#dce4eb"/>
<text x="732" y="449" text-anchor="middle" class="small">8</text>
<line x1="770" y1="172" x2="770" y2="426" stroke="#dce4eb"/>
<text x="770" y="449" text-anchor="middle" class="small">0</text>
<line x1="865" y1="172" x2="865" y2="426" stroke="#dce4eb"/>
<text x="865" y="449" text-anchor="middle" class="small">1</text>
<line x1="960" y1="172" x2="960" y2="426" stroke="#dce4eb"/>
<text x="960" y="449" text-anchor="middle" class="small">2</text>
<line x1="1055" y1="172" x2="1055" y2="426" stroke="#dce4eb"/>
<text x="1055" y="449" text-anchor="middle" class="small">3</text>
<text x="42" y="208" class="row">Renderer · 1280×720</text>
<rect x="260" y="190" width="384.7" height="26" rx="3" fill="#d56738"/>
<rect x="644.7" y="190" width="34.2" height="26" fill="#efaa78"/>
<text x="690.9" y="209" class="value">7.10</text>
<rect x="770" y="190" width="201.3" height="26" rx="3" fill="#4386b9"/>
<text x="983.3" y="209" class="value">2.12</text>
<text x="42" y="269" class="row">Renderer · 640×360</text>
<rect x="260" y="251" width="261.4" height="26" rx="3" fill="#d56738"/>
<rect x="521.4" y="251" width="36.6" height="26" fill="#efaa78"/>
<text x="570.0" y="270" class="value">5.05</text>
<rect x="770" y="251" width="196.0" height="26" rx="3" fill="#4386b9"/>
<text x="978.0" y="270" class="value">2.06</text>
<line x1="42" y1="302" x2="1077" y2="302" stroke="#d0dbe5"/>
<text x="42" y="330" class="row">SwComposite · 1280×720</text>
<rect x="260" y="312" width="386.4" height="26" rx="3" fill="#d56738"/>
<rect x="646.5" y="312" width="30.7" height="26" fill="#efaa78"/>
<text x="689.1" y="331" class="value">7.07</text>
<rect x="770" y="312" width="202.8" height="26" rx="3" fill="#4386b9"/>
<text x="984.8" y="331" class="value">2.13</text>
<text x="42" y="391" class="row">SwComposite · 640×360</text>
<rect x="260" y="373" width="251.9" height="26" rx="3" fill="#d56738"/>
<rect x="511.9" y="373" width="13.6" height="26" fill="#efaa78"/>
<text x="537.5" y="392" class="value">4.50</text>
<rect x="770" y="373" width="176.8" height="26" rx="3" fill="#4386b9"/>
<text x="958.8" y="392" class="value">1.86</text>
<text x="42" y="491" class="small">Dropped video frames: native 143/300; small 6/300. CPU and wait are separate counters, not additive wall time.</text>
<text x="42" y="513" class="small">This is thread attribution, not a native function-stack flame graph; symbols and RISC-V sampling support were unavailable.</text>
</svg>
